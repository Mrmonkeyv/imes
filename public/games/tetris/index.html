<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .game-wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 95vw;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 110px;
    }
    .box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .box-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .box-value {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }
    canvas#board {
      background: #090d16;
      border: 2px solid #334155;
      border-radius: 6px;
      display: block;
    }
    canvas.preview {
      display: block;
      margin: 0 auto;
      background: transparent;
    }
    .controls-tip {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
    .touch-controls {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
      width: 100%;
      max-width: 360px;
    }
    .touch-btn {
      background: #334155;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }
    .touch-btn:active { background: #0284c7; }
    @media (max-width: 600px) {
      .game-wrapper { transform: scale(0.9); }
      .touch-controls { display: grid; }
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .btn-action {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.15s;
    }
    .btn-action:hover { background: #0369a1; }
  </style>
</head>
<body>

<div style="position: relative;">
  <div class="game-wrapper">
    <!-- Hold Box -->
    <div class="side-panel">
      <div class="box">
        <div class="box-title">Hold (C)</div>
        <canvas id="holdCanvas" class="preview" width="80" height="80"></canvas>
      </div>
      <div class="box">
        <div class="box-title">Score</div>
        <div id="scoreVal" class="box-value">0</div>
      </div>
      <div class="box">
        <div class="box-title">Lines</div>
        <div id="linesVal" class="box-value">0</div>
      </div>
    </div>

    <!-- Main Canvas -->
    <div>
      <canvas id="board" width="240" height="480"></canvas>
    </div>

    <!-- Next & Level -->
    <div class="side-panel">
      <div class="box">
        <div class="box-title">Next</div>
        <canvas id="nextCanvas" class="preview" width="80" height="80"></canvas>
      </div>
      <div class="box">
        <div class="box-title">Level</div>
        <div id="levelVal" class="box-value">1</div>
      </div>
      <div class="box">
        <div class="box-title">High Score</div>
        <div id="highVal" class="box-value">0</div>
      </div>
    </div>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <h2 style="font-size: 24px; margin-bottom: 8px; color: #ef4444;">Game Over</h2>
    <p id="finalScore" style="color: #94a3b8; font-size: 14px;">Score: 0</p>
    <button class="btn-action" onclick="resetGame()">Play Again</button>
  </div>
</div>

<div class="controls-tip">
  ← / → Move · ↑ / X Rotate · ↓ Soft Drop · Space Hard Drop · C Hold · P Pause
</div>

<div class="touch-controls">
  <button class="touch-btn" onclick="moveLeft()">◀</button>
  <button class="touch-btn" onclick="rotate()">↻</button>
  <button class="touch-btn" onclick="hardDrop()">▼▼</button>
  <button class="touch-btn" onclick="moveRight()">▶</button>
</div>

<script>
  // Web Audio Synth
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, duration = 0.08, type = 'sine') {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  const COLS = 10;
  const ROWS = 20;
  const BLOCK_SIZE = 24;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const holdCanvas = document.getElementById('holdCanvas');
  const holdCtx = holdCanvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nextCtx = nextCanvas.getContext('2d');

  const COLORS = [
    null,
    '#00f0f0', // I - Cyan
    '#0000f0', // J - Blue
    '#f0a000', // L - Orange
    '#f0f000', // O - Yellow
    '#00f000', // S - Green
    '#a000f0', // T - Purple
    '#f00000'  // Z - Red
  ];

  const SHAPES = [
    [],
    [[1,1,1,1]], // I
    [[2,0,0],[2,2,2]], // J
    [[0,0,3],[3,3,3]], // L
    [[4,4],[4,4]], // O
    [[0,5,5],[5,5,0]], // S
    [[0,6,0],[6,6,6]], // T
    [[7,7,0],[0,7,7]]  // Z
  ];

  let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  let score = 0;
  let lines = 0;
  let level = 1;
  let highScore = parseInt(localStorage.getItem('apex_tetris_high') || '0', 10);
  document.getElementById('highVal').innerText = highScore;

  let currentPiece = null;
  let nextPieceType = null;
  let holdPieceType = null;
  let canHold = true;
  let dropCounter = 0;
  let dropInterval = 800;
  let lastTime = 0;
  let isGameOver = false;
  let isPaused = false;

  function randomPiece() {
    const id = Math.floor(Math.random() * 7) + 1;
    return {
      id: id,
      matrix: SHAPES[id].map(row => [...row]),
      x: Math.floor(COLS / 2) - Math.ceil(SHAPES[id][0].length / 2),
      y: 0
    };
  }

  function collide(board, piece) {
    const [m, o] = [piece.matrix, piece];
    for (let y = 0; y < m.length; ++y) {
      for (let x = 0; x < m[y].length; ++x) {
        if (m[y][x] !== 0) {
          const boardY = y + o.y;
          const boardX = x + o.x;
          if (boardX < 0 || boardX >= COLS || boardY >= ROWS) return true;
          if (boardY >= 0 && board[boardY][boardX] !== 0) return true;
        }
      }
    }
    return false;
  }

  function merge(board, piece) {
    piece.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0 && piece.y + y >= 0) {
          board[piece.y + y][piece.x + x] = value;
        }
      });
    });
  }

  function rotateMatrix(matrix) {
    return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
  }

  function playerRotate() {
    if (isGameOver || isPaused || !currentPiece) return;
    const oldMatrix = currentPiece.matrix;
    currentPiece.matrix = rotateMatrix(currentPiece.matrix);
    let offset = 1;
    while (collide(board, currentPiece)) {
      currentPiece.x += offset;
      offset = -(offset + (offset > 0 ? 1 : -1));
      if (offset > currentPiece.matrix[0].length) {
        currentPiece.matrix = oldMatrix;
        return;
      }
    }
    playSound(420, 0.05);
  }

  function playerMove(dir) {
    if (isGameOver || isPaused || !currentPiece) return;
    currentPiece.x += dir;
    if (collide(board, currentPiece)) {
      currentPiece.x -= dir;
    } else {
      playSound(260, 0.03);
    }
  }

  function playerDrop() {
    if (isGameOver || isPaused || !currentPiece) return;
    currentPiece.y++;
    if (collide(board, currentPiece)) {
      currentPiece.y--;
      merge(board, currentPiece);
      playSound(180, 0.06);
      clearLines();
      spawnNext();
    }
    dropCounter = 0;
  }

  function hardDrop() {
    if (isGameOver || isPaused || !currentPiece) return;
    while (!collide(board, currentPiece)) {
      currentPiece.y++;
    }
    currentPiece.y--;
    merge(board, currentPiece);
    playSound(200, 0.08, 'triangle');
    clearLines();
    spawnNext();
    dropCounter = 0;
  }

  function holdPieceAction() {
    if (isGameOver || isPaused || !canHold) return;
    if (!holdPieceType) {
      holdPieceType = currentPiece.id;
      spawnNext();
    } else {
      const temp = holdPieceType;
      holdPieceType = currentPiece.id;
      currentPiece = {
        id: temp,
        matrix: SHAPES[temp].map(row => [...row]),
        x: Math.floor(COLS / 2) - Math.ceil(SHAPES[temp][0].length / 2),
        y: 0
      };
    }
    canHold = false;
    drawMini(holdCtx, holdPieceType);
    playSound(350, 0.05);
  }

  function clearLines() {
    let linesCleared = 0;
    outer: for (let y = ROWS - 1; y >= 0; --y) {
      for (let x = 0; x < COLS; ++x) {
        if (board[y][x] === 0) continue outer;
      }
      board.splice(y, 1);
      board.unshift(Array(COLS).fill(0));
      linesCleared++;
      y++;
    }
    if (linesCleared > 0) {
      lines += linesCleared;
      const points = [0, 100, 300, 500, 800][linesCleared] * level;
      score += points;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(100, 800 - (level - 1) * 70);

      document.getElementById('scoreVal').innerText = score;
      document.getElementById('linesVal').innerText = lines;
      document.getElementById('levelVal').innerText = level;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('apex_tetris_high', highScore.toString());
        document.getElementById('highVal').innerText = highScore;
      }
      playSound(600 + linesCleared * 100, 0.15, 'square');
    }
  }

  function spawnNext() {
    if (!nextPieceType) nextPieceType = Math.floor(Math.random() * 7) + 1;
    currentPiece = {
      id: nextPieceType,
      matrix: SHAPES[nextPieceType].map(row => [...row]),
      x: Math.floor(COLS / 2) - Math.ceil(SHAPES[nextPieceType][0].length / 2),
      y: 0
    };
    nextPieceType = Math.floor(Math.random() * 7) + 1;
    drawMini(nextCtx, nextPieceType);
    canHold = true;

    if (collide(board, currentPiece)) {
      gameOver();
    }
  }

  function gameOver() {
    isGameOver = true;
    document.getElementById('finalScore').innerText = `Final Score: ${score}`;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
    playSound(120, 0.4, 'sawtooth');
  }

  function resetGame() {
    board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    score = 0;
    lines = 0;
    level = 1;
    dropInterval = 800;
    isGameOver = false;
    isPaused = false;
    holdPieceType = null;
    nextPieceType = null;
    canHold = true;

    document.getElementById('scoreVal').innerText = '0';
    document.getElementById('linesVal').innerText = '0';
    document.getElementById('levelVal').innerText = '1';
    document.getElementById('gameOverOverlay').classList.add('hidden');
    holdCtx.clearRect(0, 0, 80, 80);

    spawnNext();
  }

  function drawMini(cCtx, pieceId) {
    cCtx.clearRect(0, 0, 80, 80);
    if (!pieceId) return;
    const matrix = SHAPES[pieceId];
    const size = 16;
    const offsetX = (80 - matrix[0].length * size) / 2;
    const offsetY = (80 - matrix.length * size) / 2;
    matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          cCtx.fillStyle = COLORS[value];
          cCtx.fillRect(offsetX + x * size, offsetY + y * size, size - 1, size - 1);
        }
      });
    });
  }

  function drawGhost() {
    if (!currentPiece) return;
    const ghost = {
      matrix: currentPiece.matrix,
      x: currentPiece.x,
      y: currentPiece.y
    };
    while (!collide(board, ghost)) {
      ghost.y++;
    }
    ghost.y--;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ghost.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          ctx.fillRect((ghost.x + x) * BLOCK_SIZE, (ghost.y + y) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
        }
      });
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid lines subtle
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < canvas.width; x += BLOCK_SIZE) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += BLOCK_SIZE) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Board blocks
    board.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          ctx.fillStyle = COLORS[value];
          ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 3);
        }
      });
    });

    if (currentPiece) {
      drawGhost();
      currentPiece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = COLORS[value];
            ctx.fillRect((currentPiece.x + x) * BLOCK_SIZE, (currentPiece.y + y) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillRect((currentPiece.x + x) * BLOCK_SIZE, (currentPiece.y + y) * BLOCK_SIZE, BLOCK_SIZE - 1, 3);
          }
        });
      });
    }
  }

  function update(time = 0) {
    const deltaTime = time - lastTime;
    lastTime = time;

    if (!isGameOver && !isPaused) {
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }
    }

    draw();
    requestAnimationFrame(update);
  }

  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
      e.preventDefault();
    }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') playerMove(-1);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') playerMove(1);
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') playerDrop();
    else if (e.key === 'ArrowUp' || e.key === 'x' || e.key === 'w' || e.key === 'W') playerRotate();
    else if (e.key === ' ') hardDrop();
    else if (e.key === 'c' || e.key === 'C' || e.key === 'Shift') holdPieceAction();
    else if (e.key === 'p' || e.key === 'P') isPaused = !isPaused;
  });

  function moveLeft() { playerMove(-1); }
  function moveRight() { playerMove(1); }
  function rotate() { playerRotate(); }

  resetGame();
  requestAnimationFrame(update);
</script>
</body>
</html>
