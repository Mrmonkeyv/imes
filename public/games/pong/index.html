<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Pong Retro Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 540px;
      max-width: 95vw;
      margin-bottom: 12px;
      font-size: 24px;
      font-weight: 800;
      color: #06b6d4;
    }
    .mode-bar {
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
    }
    .btn-mode {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .btn-mode.active {
      background: #06b6d4;
      color: #020617;
      border-color: #06b6d4;
    }
    canvas {
      background: #000000;
      border: 2px solid #06b6d4;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.25);
      display: block;
      max-width: 95vw;
    }
    .tip {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="mode-bar">
  <button id="btn1P" class="btn-mode active" onclick="setMode('1P')">1 Player (vs AI)</button>
  <button id="btn2P" class="btn-mode" onclick="setMode('2P')">2 Player (Local)</button>
</div>

<div class="hud">
  <div><span id="p1Label">Player 1</span>: <span id="p1Score">0</span></div>
  <div><span id="p2Label">AI Bot</span>: <span id="p2Score">0</span></div>
</div>

<canvas id="pong" width="540" height="360"></canvas>
<div class="tip" id="instructions">P1: W / S Keys · Spacebar to Serve / Pause</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beep(freq, duration = 0.05) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  const canvas = document.getElementById('pong');
  const ctx = canvas.getContext('2d');

  let mode = '1P';
  let p1Score = 0;
  let p2Score = 0;

  const paddleH = 70;
  const paddleW = 10;
  const p1 = { x: 15, y: 145, vy: 0, speed: 6 };
  const p2 = { x: canvas.width - 25, y: 145, vy: 0, speed: 5.5 };

  const ball = { x: 270, y: 180, vx: 5, vy: 3, radius: 6, speed: 5 };
  let isPaused = false;

  function setMode(m) {
    mode = m;
    document.getElementById('btn1P').classList.toggle('active', m === '1P');
    document.getElementById('btn2P').classList.toggle('active', m === '2P');
    document.getElementById('p2Label').innerText = m === '1P' ? 'AI Bot' : 'Player 2';
    document.getElementById('instructions').innerText = m === '1P' ? 'P1: W / S Keys · Space to Pause' : 'P1: W / S · P2: Up / Down Arrow';
    resetScores();
  }

  function resetScores() {
    p1Score = 0;
    p2Score = 0;
    document.getElementById('p1Score').innerText = 0;
    document.getElementById('p2Score').innerText = 0;
    serve(1);
  }

  function serve(dir = 1) {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.speed = 5;
    ball.vx = dir * ball.speed;
    ball.vy = (Math.random() - 0.5) * 4;
  }

  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') {
      e.preventDefault();
      isPaused = !isPaused;
    }
  });
  window.addEventListener('keyup', e => keys[e.key] = false);

  function update() {
    if (!isPaused) {
      // P1 movement
      if (keys['w'] || keys['W']) p1.y = Math.max(0, p1.y - p1.speed);
      if (keys['s'] || keys['S']) p1.y = Math.min(canvas.height - paddleH, p1.y + p1.speed);

      // P2 / AI movement
      if (mode === '2P') {
        if (keys['ArrowUp']) p2.y = Math.max(0, p2.y - p2.speed);
        if (keys['ArrowDown']) p2.y = Math.min(canvas.height - paddleH, p2.y + p2.speed);
      } else {
        // AI tracking
        const center = p2.y + paddleH / 2;
        if (center < ball.y - 12) p2.y += p2.speed * 0.75;
        else if (center > ball.y + 12) p2.y -= p2.speed * 0.75;
        p2.y = Math.max(0, Math.min(canvas.height - paddleH, p2.y));
      }

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / Bottom walls
      if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy = -ball.vy; beep(350); }
      if (ball.y + ball.radius > canvas.height) { ball.y = canvas.height - ball.radius; ball.vy = -ball.vy; beep(350); }

      // P1 paddle hit
      if (
        ball.x - ball.radius <= p1.x + paddleW &&
        ball.y >= p1.y &&
        ball.y <= p1.y + paddleH &&
        ball.vx < 0
      ) {
        ball.speed = Math.min(10, ball.speed + 0.25);
        const delta = (ball.y - (p1.y + paddleH / 2)) / (paddleH / 2);
        ball.vx = ball.speed;
        ball.vy = delta * 5;
        beep(520);
      }

      // P2 paddle hit
      if (
        ball.x + ball.radius >= p2.x &&
        ball.y >= p2.y &&
        ball.y <= p2.y + paddleH &&
        ball.vx > 0
      ) {
        ball.speed = Math.min(10, ball.speed + 0.25);
        const delta = (ball.y - (p2.y + paddleH / 2)) / (paddleH / 2);
        ball.vx = -ball.speed;
        ball.vy = delta * 5;
        beep(520);
      }

      // Scoring
      if (ball.x < 0) {
        p2Score++;
        document.getElementById('p2Score').innerText = p2Score;
        beep(180, 0.2);
        serve(1);
      } else if (ball.x > canvas.width) {
        p1Score++;
        document.getElementById('p1Score').innerText = p1Score;
        beep(720, 0.2);
        serve(-1);
      }
    }

    draw();
    requestAnimationFrame(update);
  }

  function draw() {
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Center dotted line
    ctx.strokeStyle = 'rgba(6, 182, 212, 0.2)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    // Paddles
    ctx.fillStyle = '#06b6d4';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#06b6d4';
    ctx.fillRect(p1.x, p1.y, paddleW, paddleH);
    ctx.fillRect(p2.x, p2.y, paddleW, paddleH);

    // Ball
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
  }

  serve(1);
  requestAnimationFrame(update);
</script>
</body>
</html>
