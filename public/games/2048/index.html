<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .header {
      width: 380px;
      max-width: 90vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .title-group h1 {
      font-size: 38px;
      font-weight: 800;
      color: #f59e0b;
      line-height: 1;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      text-align: center;
      min-width: 70px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .score-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: #94a3b8;
    }
    .score-val {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }
    .toolbar {
      width: 380px;
      max-width: 90vw;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: #f59e0b; color: #0f172a; }
    .btn-primary:hover { background: #d97706; color: white; }
    
    .grid-container {
      position: relative;
      width: 380px;
      height: 380px;
      max-width: 90vw;
      max-height: 90vw;
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .cell {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      transition: transform 0.1s ease-in-out;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .tip {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="title-group">
    <h1>2048</h1>
  </div>
  <div class="scores">
    <div class="score-box">
      <div class="score-label">Score</div>
      <div id="score" class="score-val">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Best</div>
      <div id="best" class="score-val">0</div>
    </div>
  </div>
</div>

<div class="toolbar">
  <button class="btn" onclick="undoMove()">Undo (U)</button>
  <button class="btn btn-primary" onclick="initGame()">New Game (R)</button>
</div>

<div class="grid-container" id="grid">
  <!-- 16 cells -->
  <div id="overlay" class="overlay hidden">
    <h2 id="overlayTitle" style="font-size: 28px; margin-bottom: 8px;">Game Over</h2>
    <button class="btn btn-primary" style="padding: 10px 20px; font-size: 15px;" onclick="initGame()">Try Again</button>
  </div>
</div>

<div class="tip">Join numbers to get to the <strong>2048 tile</strong>! Arrow Keys / Swipe</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function sound(freq) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
  }

  const TILE_COLORS = {
    2: { bg: '#334155', color: '#f8fafc' },
    4: { bg: '#475569', color: '#f8fafc' },
    8: { bg: '#f97316', color: '#ffffff' },
    16: { bg: '#ea580c', color: '#ffffff' },
    32: { bg: '#ef4444', color: '#ffffff' },
    64: { bg: '#dc2626', color: '#ffffff' },
    128: { bg: '#eab308', color: '#0f172a' },
    256: { bg: '#facc15', color: '#0f172a' },
    512: { bg: '#10b981', color: '#ffffff' },
    1024: { bg: '#06b6d4', color: '#ffffff' },
    2048: { bg: '#8b5cf6', color: '#ffffff' }
  };

  let grid = [];
  let score = 0;
  let best = parseInt(localStorage.getItem('apex_2048_best') || '0', 10);
  let previousState = null;
  let isGameOver = false;

  document.getElementById('best').innerText = best;

  function initGame() {
    grid = Array.from({length: 4}, () => Array(4).fill(0));
    score = 0;
    previousState = null;
    isGameOver = false;
    document.getElementById('score').innerText = '0';
    document.getElementById('overlay').classList.add('hidden');
    addRandomTile();
    addRandomTile();
    render();
  }

  function addRandomTile() {
    const emptyCells = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (grid[r][c] === 0) emptyCells.push({r, c});
      }
    }
    if (emptyCells.length > 0) {
      const {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }
  }

  function render() {
    const container = document.getElementById('grid');
    // Remove existing cells except overlay
    const overlay = document.getElementById('overlay');
    container.innerHTML = '';
    container.appendChild(overlay);

    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const val = grid[r][c];
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (val > 0) {
          cell.innerText = val;
          const conf = TILE_COLORS[val] || { bg: '#4338ca', color: '#ffffff' };
          cell.style.background = conf.bg;
          cell.style.color = conf.color;
          if (val > 512) cell.style.fontSize = '20px';
        }
        container.appendChild(cell);
      }
    }
  }

  function saveState() {
    previousState = {
      grid: grid.map(row => [...row]),
      score: score
    };
  }

  function undoMove() {
    if (!previousState) return;
    grid = previousState.grid;
    score = previousState.score;
    previousState = null;
    document.getElementById('score').innerText = score;
    render();
  }

  function slide(row) {
    let arr = row.filter(val => val);
    let points = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        points += arr[i];
        arr.splice(i + 1, 1);
      }
    }
    while (arr.length < 4) arr.push(0);
    return { arr, points };
  }

  function moveLeft() {
    let moved = false;
    let gainedScore = 0;
    for (let r = 0; r < 4; r++) {
      const { arr, points } = slide(grid[r]);
      gainedScore += points;
      for (let c = 0; c < 4; c++) {
        if (grid[r][c] !== arr[c]) moved = true;
        grid[r][c] = arr[c];
      }
    }
    return { moved, gainedScore };
  }

  function rotateGrid() {
    grid = grid[0].map((_, i) => grid.map(row => row[i]).reverse());
  }

  function move(direction) {
    if (isGameOver) return;
    saveState();

    let times = 0;
    if (direction === 'left') times = 0;
    if (direction === 'down') times = 1;
    if (direction === 'right') times = 2;
    if (direction === 'up') times = 3;

    for (let i = 0; i < times; i++) rotateGrid();
    const { moved, gainedScore } = moveLeft();
    for (let i = 0; i < (4 - times) % 4; i++) rotateGrid();

    if (moved) {
      sound(300 + gainedScore);
      score += gainedScore;
      document.getElementById('score').innerText = score;
      if (score > best) {
        best = score;
        localStorage.setItem('apex_2048_best', best.toString());
        document.getElementById('best').innerText = best;
      }
      addRandomTile();
      render();
      checkGameStatus();
    }
  }

  function canMove() {
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (grid[r][c] === 0) return true;
        if (c < 3 && grid[r][c] === grid[r][c + 1]) return true;
        if (r < 3 && grid[r][c] === grid[r + 1][c]) return true;
      }
    }
    return false;
  }

  function checkGameStatus() {
    if (!canMove()) {
      isGameOver = true;
      document.getElementById('overlayTitle').innerText = 'Game Over';
      document.getElementById('overlay').classList.remove('hidden');
    }
  }

  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
      e.preventDefault();
    }
    if (e.key === 'ArrowLeft' || e.key === 'a') move('left');
    else if (e.key === 'ArrowRight' || e.key === 'd') move('right');
    else if (e.key === 'ArrowUp' || e.key === 'w') move('up');
    else if (e.key === 'ArrowDown' || e.key === 's') move('down');
    else if (e.key === 'u' || e.key === 'U') undoMove();
    else if (e.key === 'r' || e.key === 'R') initGame();
  });

  // Touch Swipe
  let startX = 0, startY = 0;
  window.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, {passive: false});

  window.addEventListener('touchend', e => {
    const diffX = e.changedTouches[0].clientX - startX;
    const diffY = e.changedTouches[0].clientY - startY;
    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (Math.abs(diffX) > 30) move(diffX > 0 ? 'right' : 'left');
    } else {
      if (Math.abs(diffY) > 30) move(diffY > 0 ? 'down' : 'up');
    }
  }, {passive: false});

  initGame();
</script>
</body>
</html>
